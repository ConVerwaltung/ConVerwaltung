# Builds the static site and publishes it to GitHub Pages. The repository's Pages source
# must be set to "GitHub Actions" (Settings → Pages) for the deploy step to be accepted.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running deploy is never cancelled half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gate: a broken build must not reach the public URL.
      - run: npm run lint
      - run: npm run check
      - run: npm run test

      - run: npm run build
        env:
          # Project site: everything is served under /<repo>/, so the app needs that prefix
          # baked in (vite.config.ts reads BASE_PATH).
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
